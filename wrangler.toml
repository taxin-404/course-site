name = "course-site"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[assets]
directory = "./dist/web/browser"
run_worker_first = ["/api/*"]
# Deep links (/course/..., /admin) are handled by the Angular router, so any
# unknown path must serve the app rather than a 404.
not_found_handling = "single-page-application"

# Created deliberately in APAC: the default location (WNAM) put the primary on the
# other side of the Pacific from the Worker in Dhaka, so every D1 round trip cost
# ~270 ms. No IDs on purpose: each account resolves this name to its own database.
[[d1_databases]]
binding = "DB"
database_name = "course-db-apac"

[[r2_buckets]]
binding = "RESOURCES"
bucket_name = "course-sourse"

# Shared login and per-hour lesson counters. One SQLite-backed object per key, so the state
# is shared by every Worker instance; D1 keeps the old tables as the fallback.
[[durable_objects.bindings]]
name = "RATE"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
