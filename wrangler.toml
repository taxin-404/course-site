name = "course-site"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist/web/browser"
run_worker_first = ["/api/*"]

# No IDs on purpose: Cloudflare creates these on the first deploy
[[d1_databases]]
binding = "DB"
database_name = "course-db"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "course-videos"
